<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>IJ Technologys — Websites, shops &amp; digital products</title>
<script>
(function(){
  var mobile=window.matchMedia('(max-width: 1020px)').matches;
  document.documentElement.setAttribute('data-display',mobile?'mobile':'desktop');
  try{
    var t=localStorage.getItem('ij-theme');
    if(!t) t=mobile?'light':'dark';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){document.documentElement.setAttribute('data-theme',mobile?'light':'dark');}
  document.documentElement.classList.add('js');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/images/logo.png" type="image/png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<a class="skip-link" href="#contact" data-en="Skip to contact" data-sq="Kalo te kontakti">Skip to contact</a>
<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header id="header">
  <nav class="nav" aria-label="Main">
    <a class="logo" href="#top"><img src="/images/logo.png" alt="IJ Technologys"><span>Technologys</span></a>
    <ul class="nav-links">
      <li><a href="#about" data-en="About" data-sq="Rreth nesh">About</a></li>
      <li><a href="#projects" data-en="Projects" data-sq="Projektet">Projects</a></li>
      <li><a href="#work" data-en="How we work" data-sq="Si punojmë">How we work</a></li>
      <li><a href="#clients" data-en="Clients" data-sq="Klientët">Clients</a></li>
      <li><a href="#offers" data-en="Pricing" data-sq="Çmimet">Pricing</a></li>
      <li><a href="#contact" data-en="Contact" data-sq="Kontakt">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a class="nav-login" href="/login" data-en="Log in" data-sq="Hyr">Log in</a>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
        <span class="icon-sun" aria-hidden="true">☀</span>
        <span class="icon-moon" aria-hidden="true">☽</span>
      </button>
      <div class="toggle-group lang">
        <button type="button" id="btn-sq">ALB</button>
        <button type="button" id="btn-en" class="active">ENG</button>
      </div>
      <button type="button" class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </nav>
</header>
<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
  <a href="#about" data-en="About" data-sq="Rreth nesh">About</a>
  <a href="#projects" data-en="Projects" data-sq="Projektet">Projects</a>
  <a href="#work" data-en="How we work" data-sq="Si punojmë">How we work</a>
  <a href="#clients" data-en="Clients" data-sq="Klientët">Clients</a>
  <a href="#offers" data-en="Pricing" data-sq="Çmimet">Pricing</a>
  <a href="#contact" data-en="Contact" data-sq="Kontakt">Contact</a>
  <a class="mobile-menu-login" href="/login" data-en="Log in" data-sq="Hyr">Log in</a>
  <div class="mobile-menu-tools">
    <button type="button" class="theme-toggle" id="themeToggleMenu" aria-label="Toggle light and dark mode">
      <span class="icon-sun" aria-hidden="true">☀</span>
      <span class="icon-moon" aria-hidden="true">☽</span>
    </button>
    <div class="mobile-menu-lang toggle-group lang">
      <button type="button" id="btn-sq-menu">ALB</button>
      <button type="button" id="btn-en-menu" class="active">ENG</button>
    </div>
  </div>
</div>

<main id="top">

<section class="hero" id="about">
  <div class="container hero-grid">
    <div class="reveal in">
      <p class="section-label" data-cms="hero.label"></p>
      <h1 data-cms="hero.title"></h1>
      <p class="lead" data-cms="hero.lead"></p>
      <div class="cta-row">
        <a class="btn primary" href="#contact" data-cms="hero.ctaPrimary" data-plan="Pro"></a>
        <a class="btn" href="#offers" data-cms="hero.ctaSecondary"></a>
      </div>
      <div class="stats" data-cms="stats"></div>
    </div>
    <div class="hero3d reveal in d1" id="hero3d">
      <div class="card-overlay" id="cardOverlay" aria-hidden="true">
        <div class="co-mark"><img src="/images/logo.png" alt=""></div>
        <p class="card-title" data-cms="hero.cardTitle"></p>
        <p class="card-meta" data-cms="hero.cardMeta"></p>
      </div>
      <span class="hint hint-mobile"></span>
    </div>
  </div>
</section>

<div class="strip" aria-hidden="true">
  <div class="strip-track" id="strip">
    <span data-cms="sections.stripText"></span>
  </div>
</div>

<section class="projects-wrap" id="projects">
  <div class="projects-stage">
    <div class="sec-head center">
      <h2 data-cms="sections.projectsHeadline"></h2>
      <p class="sub sub-desktop" data-cms="sections.projectsSub"></p>
      <p class="sub sub-mobile" data-cms="sections.projectsSubMobile"></p>
    </div>
    <span class="scroll-hint" id="scrollHint">
      <span class="wheel"></span>
      <span data-en="Scroll to explore" data-sq="Lëviz për të eksploruar">Scroll to explore</span>
    </span>
    <div class="orbit-scene" id="orbitScene">
      <canvas id="globeCanvas" aria-hidden="true"></canvas>
      <div class="ring" id="ring"></div>
    </div>
  </div>
</section>

<section class="work" id="work">
  <div class="container work-grid">
    <div class="laptop reveal" aria-hidden="true">
      <div class="laptop-lid">
        <div class="laptop-front">
          <div class="laptop-screen">
            <video class="desk-video" autoplay muted loop playsinline preload="metadata">
              <source src="videos/coding-monitor.mp4" type="video/mp4">
            </video>
          </div>
        </div>
        <div class="laptop-shell"></div>
        <div class="laptop-edge"></div>
      </div>
      <div class="laptop-base"><span class="laptop-notch"></span></div>
    </div>
    <div class="work-copy reveal d1">
      <h2 data-cms="sections.workTitle"></h2>
      <p data-cms="sections.workBody"></p>
      <ul class="feature-list" id="workFeatures"></ul>
    </div>
  </div>
</section>

<section class="clients" id="clients">
  <div class="container sec-head center reveal">
    <h2 data-en="What clients say" data-sq="Çfarë thonë klientët">What clients say</h2>
  </div>
  <div class="marquee-wrap" aria-label="Client testimonials">
    <!-- Real client reviews are injected here from /api/reviews (4★+ only). -->
    <div class="marquee" id="marquee"></div>
  </div>
</section>

<section class="offers" id="offers">
  <div class="container">
    <div class="sec-head center reveal">
      <h2 data-cms="sections.pricingTitle"></h2>
      <p class="sub" data-cms="sections.pricingSub"></p>
    </div>
    <div class="offer-grid" data-cms="pricing"></div>
    <p class="pricing-note reveal" data-cms="pricing.note"></p>
  </div>
</section>

<section class="suit">
  <div class="container">
    <div class="suit-inner reveal">
      <div class="suit-img"><img src="" alt=""></div>
      <div class="suit-copy">
        <h2 data-cms="sections.suitTitle"></h2>
        <p data-cms="sections.suitBody"></p>
        <a class="btn primary plan-cta" href="#contact" data-plan=""></a>
      </div>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="container">
    <div class="contact-inner">
      <div class="sec-head center reveal">
        <h2 data-cms="sections.contactTitle"></h2>
        <p class="sub" data-cms="sections.contactSub"></p>
      </div>
      <div class="contact-steps reveal" id="contactSteps"></div>
      <form class="contact-form reveal d1" id="contactForm" novalidate>
        <div class="field row">
          <div class="field" id="field-name">
            <label for="cf-name" data-en="Name" data-sq="Emri">Name</label>
            <input id="cf-name" name="name" type="text" autocomplete="name" required
                   data-en="Your name" data-sq="Emri yt" placeholder="Your name">
            <span class="field-error" id="err-name" role="alert"></span>
          </div>
          <div class="field" id="field-email">
            <label for="cf-email" data-en="Email" data-sq="Email">Email</label>
            <input id="cf-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
            <span class="field-error" id="err-email" role="alert"></span>
          </div>
        </div>
        <div class="field" id="field-package">
          <label for="cf-package" data-en="Package" data-sq="Paketa">Package</label>
          <select id="cf-package" name="package">
            <option value="" data-en="Not sure yet" data-sq="Ende nuk jam i sigurt">Not sure yet</option>
          </select>
        </div>
        <div class="field" id="field-message">
          <label for="cf-message" data-en="Message" data-sq="Mesazhi">Message</label>
          <textarea id="cf-message" name="message" required
                    data-en="What would you like to build?" data-sq="Çfarë do të ndërtosh?"
                    placeholder="What would you like to build?"></textarea>
          <span class="field-error" id="err-message" role="alert"></span>
        </div>
        <button class="btn primary" type="submit" data-en="Send message" data-sq="Dërgo mesazhin">Send message</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>

<section class="review" id="review">
  <div class="container">
    <div class="review-inner">
      <div class="sec-head center reveal">
        <h2 data-cms="sections.reviewTitle"></h2>
        <p class="sub" data-cms="sections.reviewSub"></p>
      </div>
      <form class="contact-form reveal d1" id="reviewForm" novalidate>
        <div class="field row">
          <div class="field" id="rfield-name">
            <label for="rf-name" data-en="Name" data-sq="Emri">Name</label>
            <input id="rf-name" name="name" type="text" autocomplete="name" required
                   data-en="Your name" data-sq="Emri yt" placeholder="Your name">
            <span class="field-error" id="rerr-name" role="alert"></span>
          </div>
          <div class="field" id="rfield-role">
            <label for="rf-role" data-en="Business (optional)" data-sq="Biznesi (opsionale)">Business (optional)</label>
            <input id="rf-role" name="role" type="text" autocomplete="organization"
                   data-en="e.g. Buna Market" data-sq="p.sh. Buna Market" placeholder="e.g. Buna Market">
            <span class="field-error" id="rerr-role" role="alert"></span>
          </div>
        </div>
        <div class="field" id="rfield-rating">
          <label data-en="Rating" data-sq="Vlerësimi">Rating</label>
          <div class="rating" id="ratingInput" role="radiogroup" aria-label="Rating">
            <button type="button" class="star" data-val="1" aria-label="1 star">★</button>
            <button type="button" class="star" data-val="2" aria-label="2 stars">★</button>
            <button type="button" class="star" data-val="3" aria-label="3 stars">★</button>
            <button type="button" class="star" data-val="4" aria-label="4 stars">★</button>
            <button type="button" class="star" data-val="5" aria-label="5 stars">★</button>
          </div>
          <input type="hidden" name="rating" id="rf-rating" value="5">
          <span class="field-error" id="rerr-rating" role="alert"></span>
        </div>
        <div class="field" id="rfield-text">
          <label for="rf-text" data-en="Your review" data-sq="Vlerësimi yt">Your review</label>
          <textarea id="rf-text" name="text" required
                    data-en="What was it like working with us?" data-sq="Si ishte të punoje me ne?"
                    placeholder="What was it like working with us?"></textarea>
          <span class="field-error" id="rerr-text" role="alert"></span>
        </div>
        <button class="btn primary" type="submit" data-en="Post review" data-sq="Posto vlerësimin">Post review</button>
        <p class="form-status" id="reviewStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>

</main>

<a class="contact-fab" href="#contact" data-en="Contact" data-sq="Kontakt">Contact</a>

<footer>
  <div class="container">
    <div class="foot-grid">
      <div>
        <a class="logo" href="#top"><img src="/images/logo.png" alt="IJ Technologys"><span>Technologys</span></a>
        <p data-cms="footer.tagline"></p>
      </div>
      <div class="foot-col foot-links-col">
        <h3 data-cms="footer.linksHeading" data-en="Connect" data-sq="Lidhu">Connect</h3>
        <div class="foot-links" id="footLinks"></div>
      </div>
    </div>
    <div class="foot-note">
      <span data-cms="footer.copyright"></span>
      <span data-cms="footer.credit"></span>
    </div>
  </div>
</footer>

<script src="/js/footerLinkUtils.js"></script>
<script src="/js/content.js"></script>
<script src="/js/main.js"></script>
<script src="/js/contact.js"></script>
<script src="/js/reviews.js"></script>
<script src="/js/assistant.js"></script>
</body>
</html>
